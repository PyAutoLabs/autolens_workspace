- cluster/start_here # SLOW 2026-07-22 - hits the full 1800s mode=release cap in workspace-validation (PyAutoHeart run 29912642195). Script-specific, not a shard-wide problem: every other cluster script passes, the next-slowest being lenstool/modeling.py at 137.8s. Consistent with cluster scripts being known un-smoke-able (>500s even in TEST_MODE). Not yet profiled — SLOW-skipped to unblock the release; remove once the cost is found and fixed (autolens_workspace#314).
- weak/features/strong_lensing/a2744 # SLOW 2026-07-22 - hits the full 1800s mode=release cap in workspace-validation (PyAutoHeart run 29912642195). Script-specific: its sibling weak/real_data/a2744.py passes in 8.9s and the next-slowest weak script is modeling.py at 23.6s, so the cost is in the strong_lensing feature path rather than the A2744 dataset itself. Not yet profiled — SLOW-skipped to unblock the release (autolens_workspace#314).
- guides/modeling/advanced/expectation_propagation.py # NEEDS_FIX 2026-08-03 - EP parked as not release-ready. EP message projection is unstable: a truncated per-factor search projects an ESS=1 posterior with zero weighted variance, which EP feeds back as a delta-function prior. See PyAutoFit #1332 F10 and autofit_workspace_test graphical/ep.py.
- multi_galaxy/features/scaling_relation/slam # NEEDS_FIX 2026-08-29 - REASON REPLACED (third cause). Cause 1, the 0.0-luminosity / (0.0/0.0)**0.5 NaN from the capped-loader mislabel (autolens_workspace#419), was fixed by PyAutoArray#430/PR#431. Cause 2, the literal-vs-dataset pixel_scale mask collapse (enlarged radius 0.30, "zero-size array to reduction operation minimum"), was fixed by autolens_workspace#501/#502 and is now VERIFIED by a cache-free capped run on 2026-08-29 (autolens_workspace#514): "Enlarged mask radius: 4.70", masks populated (80 / 192 pixels), lens_light[1] and lens_light[2] both run. The script then dies on a THIRD fault: under the smoke profile (PYAUTO_TEST_MODE=2, PYAUTO_SMALL_DATASETS=1) the truncated lens_light MGE stages return max-likelihood samples whose linear intensities are all 0.0, so luminosity_from raises "Measured luminosity is 0.0" (slam.py:146) before the relation is built. The imaging sibling passes the same profile with a non-zero anchor (22.47, autolens_workspace#513), so this is NOT a generic test-mode limitation - it is specific to this script's two-stage light setup and needs diagnosis: PyAutoMind draft/bug/autolens_workspace/multi_galaxy_scaling_relation_zero_intensity_under_smoke.md. Stays parked until a capped run of THIS script exits 0 (PR#312 un-parked group/slam on an assumed fix and the failure resurfaced). Output prefix is multi_galaxy/slam/ - clear output/test_mode/multi_galaxy/slam/ before any re-run or a stale tree fakes a pass. interferometer/features/scaling_relation/slam is NOT affected and must stay runnable: it hardcodes luminosity_anchor instead of measuring it.
