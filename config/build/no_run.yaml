- point_source/features/multiple_sources/modeling # Blocked by PyAutoLens #480: same root cause as simulator above
- interferometer/casa_reduction # Requires CASA MeasurementSet output, not runnable standalone
- cluster/start_here # SLOW 2026-07-22 - hits the full 1800s mode=release cap in workspace-validation (PyAutoHeart run 29912642195). Script-specific, not a shard-wide problem: every other cluster script passes, the next-slowest being lenstool/modeling.py at 137.8s. Consistent with cluster scripts being known un-smoke-able (>500s even in TEST_MODE). Not yet profiled — SLOW-skipped to unblock the release; remove once the cost is found and fixed (autolens_workspace#314).
- weak/features/strong_lensing/a2744 # SLOW 2026-07-22 - hits the full 1800s mode=release cap in workspace-validation (PyAutoHeart run 29912642195). Script-specific: its sibling weak/real_data/a2744.py passes in 8.9s and the next-slowest weak script is modeling.py at 23.6s, so the cost is in the strong_lensing feature path rather than the A2744 dataset itself. Not yet profiled — SLOW-skipped to unblock the release (autolens_workspace#314).
- guides/results/database/start_here # NEEDS_FIX 2026-07-30 - fails fast in a clean checkout (FileNotFoundError dataset/imaging/simple/data.fits - needs simulator outputs); was mis-parked as SLOW against the 60s-cap myth
- imaging/features/scaling_relation/slam # NEEDS_FIX 2026-07-30 - measures its luminosities from a preceding light stage, which under PYAUTO_TEST_MODE returns no usable samples, so every measured luminosity is 0.0 and the relation evaluates (0.0/0.0)**0.5 = NaN. The NaN surfaces far away: TEST_MODE=2 -> IndexError index -9223372036854775808 (INT_MIN) in PyAutoArray mapper_util.adaptive_pixel_signals_from; TEST_MODE=1 -> ValueError cannot convert float NaN to integer in PyAutoFit identifier.py:142. `ENV: real_search` was measured as the alternative and rejected: still running at 1293s when the measurement was stopped, vs the 300s default cap and 1800s mode=release cap — and that is a LOWER bound, the script had not finished (autolens_workspace#419). luminosity_from now raises with the cause named, so a future runner gets a legible error rather than either traceback.
- multi_galaxy/features/scaling_relation/slam # NEEDS_FIX 2026-07-30 - same 0.0-luminosity / (0.0/0.0)**0.5 NaN cause as imaging/features/scaling_relation/slam above (autolens_workspace#419). Note interferometer/features/scaling_relation/slam is NOT affected and must stay runnable: it hardcodes luminosity_anchor instead of measuring it.
