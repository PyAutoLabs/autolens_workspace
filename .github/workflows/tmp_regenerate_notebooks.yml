name: Temporary Notebook Regeneration

on:
  push:
    branches:
      - fix/release-fidelity-small-datasets

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          path: workspace
      - name: Checkout PyAutoHands
        uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/PyAutoHands
          path: PyAutoHands
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install generator dependencies
        run: pip install --quiet ipynb-py-convert pyyaml
      - name: Regenerate notebooks and catalogue
        run: |
          cd workspace
          PYTHONPATH=../PyAutoHands/autohands python3 ../PyAutoHands/autohands/generate.py autolens
      - name: Commit canonical generated files
        run: |
          cd workspace
          git reset
          git add -f \
            notebooks/cluster/lenstool/data.ipynb \
            notebooks/weak/real_data/a2744.ipynb \
            llms-full.txt \
            workspace_index.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate notebooks for release-fidelity fixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
